[package]
name = "gcarve-core"
description = "GCarve CAM engine: geometry, toolpaths, posts (no UI)"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
clipper2-rust = "1.2"   # pure-Rust Clipper2: offsets + booleans (same algorithm as the C++ engine)
boostvoronoi = "0.12"   # pure-Rust Boost.Polygon Voronoi: v-carve medial axis
miniz_oxide = "0.8"     # inflate for PDF / .ai import (pure Rust, already in the tree through png)
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }  # .tlp projects, user posts; exact float parsing so files re-save identically
