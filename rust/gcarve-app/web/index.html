<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>GCarve</title>
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<!-- the program starts downloading with the page, not after its loader script has arrived -->
<link rel="preload" href="./gcarve_bg.wasm?v=BUILD" as="fetch" type="application/wasm" crossorigin>
<link rel="modulepreload" href="./gcarve.js?v=BUILD">
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#262626; color:#d9d9d9; font:15px -apple-system,"Segoe UI",Roboto,sans-serif }
  /* an app, not a document: Ctrl/Cmd+A selects the shapes, never the account bar's text */
  body { -webkit-user-select:none; user-select:none }
  #gcarve { width:100%; height:100%; display:block; outline:none }
  #loading { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; background:#1f2024 }
  #loading b { font-size:24px }
  .bar { width:240px; height:4px; border-radius:2px; background:#33353b; overflow:hidden }
  .bar i { display:block; height:100%; width:35%; background:linear-gradient(90deg,#1473e6,#ff9a2e); animation:s 1.2s ease-in-out infinite }
  @keyframes s { 0% { transform:translateX(-100%) } 100% { transform:translateX(300%) } }
</style>
<script src="/assets/accountbar.js" defer></script>
<script>// the app sets window.gcarveDirty while there is unsaved work: the browser then asks before a refresh / close
window.addEventListener("beforeunload", e => { if (window.gcarveDirty) { e.preventDefault(); e.returnValue = ""; } });</script>
</head>
<body>
<canvas id="gcarve"></canvas>
<div id="loading"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="88" height="88">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3038"/><stop offset="1" stop-color="#17191c"/></linearGradient>
    <linearGradient id="path" gradientUnits="userSpaceOnUse" x1="260" y1="260" x2="760" y2="780"><stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#ff8a1f"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="none" stroke="#4a4f58" stroke-width="6"/>
  <!-- board grid -->
  <g stroke="#3a3e46" stroke-width="4">
    <path d="M160 320h704M160 480h704M160 640h704M160 800h704M320 160v704M480 160v704M640 160v704M800 160v704"/>
  </g>
  <!-- the G as a carved groove: dark channel, then the orange cut -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#sh)">
    <path id="g" d="M716 356c-44-68-120-110-204-110-140 0-252 118-252 266s112 266 252 266c84 0 160-42 204-110v-140H540"/>
    <use href="#g" stroke="#101214" stroke-width="124"/>
    <use href="#g" stroke="url(#path)" stroke-width="86"/>
  </g>
  <!-- V-bit at the end of the cut (centre of the G's bar) -->
  <g filter="url(#sh)">
    <path d="M495 470l0 -120 90 0 0 120z" fill="#9ad0ff"/>
    <path d="M495 470l45 100 45 -100z" fill="#5aa1ec"/>
    <rect x="522" y="330" width="36" height="22" rx="4" fill="#d7dae0"/>
  </g>
</svg><b>GCarve</b><div class="bar"><i></i></div></div>
<script type="module">
  // BUILD is replaced by build-web.sh with this build's fingerprint: the script and the program always load as a
  // matching pair, whatever a browser or Cloudflare still has cached from the previous deploy
  import init from "./gcarve.js?v=BUILD";
  // load failures and script errors go to the site's error log (admin overview); once per page, no personal data
  let reported = 0;
  const report = (source, message) => {
    if (reported++ > 2) return;
    try { fetch("/api/error", { method: "POST", headers: { "Content-Type": "application/json" }, keepalive: true,
      body: JSON.stringify({ source, message: String(message).slice(0, 300), where: navigator.userAgent.slice(0, 120) }) }); } catch (_) {}
  };
  // the file name and line make a "Cannot read properties of undefined" findable (one such report, 2026-10-16, had neither)
  window.addEventListener("error", e => report("load", (e.message || e.error) + (e.filename ? " @" + e.filename.split("/").pop().split("?")[0] + ":" + e.lineno + ":" + e.colno : "")));
  window.addEventListener("unhandledrejection", e => report("load", e.reason));
  // the download fills the bar (the size of the uncompressed program is stamped in by build-web.sh); without it, or
  // when the body can't be streamed, the bar keeps sweeping
  const program = async () => {
    const r = await fetch("./gcarve_bg.wasm?v=BUILD"), size = +"RAWSIZE";
    const bar = document.querySelector("#loading .bar i");
    if (!r.ok || !r.body || !(size > 0) || !bar) return r;
    bar.style.animation = "none"; bar.style.width = "2%"; bar.style.transition = "width .2s";
    const rd = r.body.getReader(); let got = 0;
    return new Response(new ReadableStream({ async pull(c) {
      const { done, value } = await rd.read();
      if (done) { bar.style.width = "100%"; c.close(); return; }
      got += value ? value.length : 0; bar.style.width = Math.min(98, 2 + got * 96 / size) + "%"; c.enqueue(value);
    } }), { headers: { "Content-Type": "application/wasm" } });
  };
  init({ module_or_path: program() }).catch(e => { report("load", "start: " + e); document.getElementById("loading").innerHTML = "GCarve couldn't start in this browser: " + e; });
</script>
</body>
</html>
