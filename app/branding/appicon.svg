<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3038"/><stop offset="1" stop-color="#17191c"/></linearGradient>
    <linearGradient id="path" gradientUnits="userSpaceOnUse" x1="260" y1="260" x2="760" y2="780"><stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#ff8a1f"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="none" stroke="#4a4f58" stroke-width="6"/>
  <!-- board grid -->
  <g stroke="#3a3e46" stroke-width="4">
    <path d="M160 320h704M160 480h704M160 640h704M160 800h704M320 160v704M480 160v704M640 160v704M800 160v704"/>
  </g>
  <!-- the G as a carved groove: dark channel, then the orange cut -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#sh)">
    <path id="g" d="M716 356c-44-68-120-110-204-110-140 0-252 118-252 266s112 266 252 266c84 0 160-42 204-110v-140H540"/>
    <use href="#g" stroke="#101214" stroke-width="124"/>
    <use href="#g" stroke="url(#path)" stroke-width="86"/>
  </g>
  <!-- V-bit at the end of the cut (centre of the G's bar) -->
  <g filter="url(#sh)">
    <path d="M495 470l0 -120 90 0 0 120z" fill="#9ad0ff"/>
    <path d="M495 470l45 100 45 -100z" fill="#5aa1ec"/>
    <rect x="522" y="330" width="36" height="22" rx="4" fill="#d7dae0"/>
  </g>
</svg>
